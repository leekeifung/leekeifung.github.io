<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Camera Overlay AR Test</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(15,23,42,0.8);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: var(--text);
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
    z-index: 0;
  }
  #canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
    z-index: 1;
  }
  #ui {
    position: fixed; inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    z-index: 2;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    pointer-events: auto;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-weight: 700;
    cursor: pointer;
    background: #0ea5e9;
    color: #0b1120;
    box-shadow: 0 10px 24px rgba(14,165,233,0.35);
  }
  .panel {
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 12px;
    max-width: 480px;
    width: min(480px, 100%);
  }
  #debug {
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    padding: 8px 10px;
    font-family: "SFMono-Regular", ui-monospace, monospace;
    font-size: 0.9rem;
    color: var(--muted);
    white-space: pre-wrap;
  }
  #errorCard {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 20px; z-index: 3;
    background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%), #0b1120;
  }
  #errorCard .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 18px 20px;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="row">
    <button class="btn" id="startBtn">Start camera</button>
    <button class="btn" id="retryBtn" style="display:none;">Retry</button>
  </div>
  <div class="panel">
    <div style="font-weight:700; margin-bottom:6px;">Instructions</div>
    <div style="color:var(--muted); line-height:1.5; font-size:0.95rem;">
      • Tap anywhere to place a marker.<br>
      • Works on iOS Safari/Chrome (camera overlay; no WebXR).<br>
    </div>
    <div id="debug">Debug: waiting</div>
  </div>
</div>

<div id="errorCard" hidden>
  <div class="card">
    <h2 style="margin:0 0 8px;">Camera not available</h2>
    <p style="color:var(--muted); margin:4px 0 10px;">Allow camera permission and use HTTPS.</p>
    <p id="errMsg" style="color:var(--accent); margin:0;"></p>
  </div>
</div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const debug = document.getElementById('debug');
  const errorCard = document.getElementById('errorCard');
  const errMsg = document.getElementById('errMsg');

  let W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;

  let marker = null;
  let currentStream = null;

  const log = (m) => { debug.textContent = 'Debug: ' + m; console.log(m); };
  const showError = (m) => { errMsg.textContent = m || ''; errorCard.hidden = false; log('Error: ' + m); };
  const hideError = () => { errorCard.hidden = true; errMsg.textContent = ''; };

  function render() {
    ctx.clearRect(0,0,W,H);
    // simple crosshair center
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const cx = W/2, cy = H/2, r = 14;
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
    if (marker) {
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(marker.x, marker.y, 10, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#0b1120';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  canvas.addEventListener('click', (e) => {
    marker = { x: e.clientX, y: e.clientY };
    render();
  });

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    render();
  });

  window.addEventListener('pagehide', () => {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  });

  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    const constraintsList = [
      { video: { facingMode: { ideal: "environment" } }, audio: false },
      { video: true, audio: false },
    ];
    log('Requesting camera…');
    try {
      let stream = null, lastErr = null;
      for (const c of constraintsList) {
        try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
        catch (e) { lastErr = e; }
      }
      if (!stream) throw lastErr || new Error('Unknown camera error');
      currentStream = stream;
      video.srcObject = stream;
      video.setAttribute('playsinline','');
      video.setAttribute('autoplay','');
      video.setAttribute('muted','');
      await video.play().catch(()=>{});
      // enumerate devices for debug
      let devicesInfo = '';
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        devicesInfo = devices.map(d => `${d.kind}: ${d.label||'(no label)'}`).join('\n');
      } catch (e) { devicesInfo = 'enumerateDevices failed: ' + e; }
      hideError();
      startBtn.textContent = "Camera on";
      startBtn.disabled = true;
      startBtn.style.opacity = 0.7;
      retryBtn.style.display = 'inline-flex';
      log('Success.\nDevices:\n' + devicesInfo);
    } catch (err) {
      console.warn('Camera error', err);
      const msg = `${err.name || 'Error'}: ${err.message || err}`;
      showError(msg);
      startBtn.textContent = "Start camera";
      startBtn.disabled = false;
      startBtn.style.opacity = 1;
      retryBtn.style.display = 'inline-flex';
    }
  }

  startBtn.addEventListener('click', () => startCamera());
  retryBtn.addEventListener('click', () => startCamera());

  render();
})();
</script>
</body>
</html>
