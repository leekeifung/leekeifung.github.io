<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Camera Test</title>
<style>
body { margin:0; background:#0b1120; color:#e2e8f0; font-family:system-ui; display:flex; flex-direction:column; gap:12px; padding:16px; }
video { width:100%; max-width:400px; background:#000; border:1px solid #334155; border-radius:12px; }
button { padding:10px 14px; border:none; border-radius:12px; font-weight:700; background:#0ea5e9; color:#0b1120; }
pre { background:#111827; padding:12px; border-radius:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<h2>Camera Test</h2>
<button id="btn">Start camera</button>
<video id="v" playsinline muted autoplay></video>
<pre id="log"></pre>
<script>
const log = (m) => { document.getElementById('log').textContent = m; };
document.getElementById('btn').onclick = async () => {
  log('Requesting camera…');
  try {
    const constraintsList = [
      { video: { facingMode: { ideal: "environment" } }, audio: false },
      { video: true, audio: false },
    ];
    let stream = null, lastErr = null;
    for (const c of constraintsList) {
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch (e) { lastErr = e; }
    }
    if (!stream) throw lastErr || new Error('Unknown error');
    document.getElementById('v').srcObject = stream;
    await document.getElementById('v').play().catch(()=>{});
    const devices = await navigator.mediaDevices.enumerateDevices();
    log('Success.\nDevices:\n' + devices.map(d => `${d.kind}: ${d.label||'(no label)'}`).join('\n'));
  } catch (e) {
    log(`${e.name || 'Error'}: ${e.message || e}`);
  }
};
</script>
</body>
</html>
