<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complex Branches – Log, √z, n-th Roots</title>
<style>
:root {
  color-scheme: light;
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8fafc;
  color: #0f172a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
h1 { margin: 0; font-size: 1.3rem; font-weight: 700; color: #0f172a; }
.panel {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  align-items: end;
}
label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.9rem;
  color: #334155;
  font-weight: 600;
}
input, select, button {
  height: 38px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 0 10px;
  font-size: 0.95rem;
  background: white;
  color: #0f172a;
}
input:focus, select:focus {
  outline: 2px solid #2563eb;
  outline-offset: 1px;
}
button {
  cursor: pointer;
  background: linear-gradient(120deg, #2563eb, #1d4ed8);
  color: white;
  font-weight: 700;
  border: none;
  transition: transform 0.05s ease, box-shadow 0.1s ease;
}
button:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,0.15); }
small { color: #475569; }
.canvas-wrap {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}
canvas {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  display: block;
}
.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 0.9rem;
  color: #334155;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 0.95rem; }
.badge {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 999px;
  background: #e0f2fe;
  color: #0ea5e9;
  font-weight: 700;
  font-size: 0.8rem;
}
.flex-row { display: flex; gap: 8px; flex-wrap: wrap; }
ul { padding-left: 16px; margin: 6px 0 0 0; }
@media (max-width: 640px) { canvas { aspect-ratio: 1 / 1; } }
</style>
</head>
<body>
  <div class="panel">
    <h1>Complex Branches: Log, √z, and n-th Roots</h1>
    <div class="grid-2" style="margin-top:10px;">
      <label>
        Function
        <select id="func">
          <option value="log">Log z (branch cut)</option>
          <option value="sqrt">√z (two branches)</option>
          <option value="nthroot">z^{1/n} (n branches)</option>
        </select>
      </label>
      <label id="nWrap" style="display:none;">
        n (for z^{1/n})
        <input id="nVal" type="number" min="2" max="12" step="1" value="3" />
      </label>
      <label>
        Branch cut angle θ₀ (deg, ray from 0)
        <input id="theta0" type="range" min="0" max="360" step="1" value="0" />
      </label>
      <label id="kWrap">
        Branch index k
        <input id="kVal" type="number" step="1" value="0" />
        <small id="kHint">Log: k ∈ ℤ (use small integers)</small>
      </label>
      <label>
        Point z: real part a
        <input id="real" type="number" step="0.1" value="1.0" />
      </label>
      <label>
        Point z: imag part b
        <input id="imag" type="number" step="0.1" value="0.0" />
      </label>
      <div class="flex-row">
        <button id="update">Update</button>
        <button id="random" style="background:linear-gradient(120deg,#059669,#047857);">Random z</button>
        <button id="reset" style="background:linear-gradient(120deg,#475569,#334155);">Reset</button>
      </div>
      <div class="flex-row" style="align-items:center; gap:12px;">
        <label style="flex-direction:row; align-items:center; gap:8px; font-weight:600; color:#334155;">
          <input id="showAll" type="checkbox" />
          Show all branches (outputs)
        </label>
        <label style="flex-direction:row; align-items:center; gap:8px; font-weight:600; color:#334155;">
          <input id="snapUnit" type="checkbox" />
          Snap z to unit circle
        </label>
      </div>
    </div>
    <small>Drag on the left canvas to move z. Branch cut is the colored ray at angle θ₀.</small>
  </div>

  <div class="panel">
    <div class="legend" style="margin-bottom:8px;">
      <span><span class="dot" style="background:#ef4444"></span> z (input)</span>
      <span><span class="dot" style="background:#22c55e"></span> Branch cut ray</span>
      <span><span class="dot" style="background:#2563eb"></span> f(z) on selected branch</span>
      <span><span class="dot" style="background:#f59e0b"></span> Other branches (if shown)</span>
    </div>
    <div class="canvas-wrap">
      <div>
        <div class="mono" style="margin-bottom:6px;">Domain (z-plane)</div>
        <canvas id="dom"></canvas>
      </div>
      <div>
        <div class="mono" style="margin-bottom:6px;">Range (w = f(z))</div>
        <canvas id="ran"></canvas>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="badge">Details</div>
    <ul class="mono" id="details" style="line-height:1.5;"></ul>
  </div>

<script>
(() => {
  // ---------- Helpers ----------
  const TAU = 2 * Math.PI;
  const dom = document.getElementById('dom');
  const ran = document.getElementById('ran');
  const dctx = dom.getContext('2d');
  const rctx = ran.getContext('2d');

  const funcSel = document.getElementById('func');
  const nWrap = document.getElementById('nWrap');
  const nVal = document.getElementById('nVal');
  const kWrap = document.getElementById('kWrap');
  const kVal = document.getElementById('kVal');
  const kHint = document.getElementById('kHint');
  const theta0 = document.getElementById('theta0');
  const realIn = document.getElementById('real');
  const imagIn = document.getElementById('imag');
  const showAll = document.getElementById('showAll');
  const snapUnit = document.getElementById('snapUnit');

  const btnUpdate = document.getElementById('update');
  const btnRandom = document.getElementById('random');
  const btnReset = document.getElementById('reset');
  const details = document.getElementById('details');

  let z = { a: 1, b: 0 };
  let func = 'log';
  let n = 3;
  let k = 0;
  let theta0Deg = 0;
  let dragging = false;
  let domScale = 90; // pixels per unit (adaptive)
  let ranScale = 90;

  function resizeCanvas(canvas, ctx) {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function fitScale(canvas, points, currentScale, minScale = 40, maxScale = 200) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    let maxR = 1;
    for (const p of points) {
      const r = Math.hypot(p.x, p.y);
      maxR = Math.max(maxR, r);
    }
    const margin = 0.85;
    const limitingPx = Math.min(cx, cy) * margin;
    const newScale = limitingPx / maxR;
    return Math.max(minScale, Math.min(maxScale, newScale));
  }

  function argWithCut(a, b, theta0Rad) {
    let th = Math.atan2(b, a); // (-π, π]
    while (th < theta0Rad) th += TAU;
    while (th >= theta0Rad + TAU) th -= TAU;
    return th; // in [theta0Rad, theta0Rad + 2π)
  }

  function formatAngle(rad) {
    const deg = rad * 180 / Math.PI;
    return deg.toFixed(2) + '°';
  }

  function drawGrid(ctx, canvas, scale) {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const cx = w / 2, cy = h / 2;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e2e8f0';
    const stepUnits = 1;
    const maxX = Math.ceil(w / (2 * scale));
    const maxY = Math.ceil(h / (2 * scale));
    ctx.beginPath();
    for (let i = -maxX; i <= maxX; i++) {
      const x = cx + i * scale;
      ctx.moveTo(x, 0); ctx.lineTo(x, h);
    }
    for (let j = -maxY; j <= maxY; j++) {
      const y = cy + j * scale;
      ctx.moveTo(0, y); ctx.lineTo(w, y);
    }
    ctx.stroke();
    // axes
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, cy); ctx.lineTo(w, cy);
    ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
    ctx.stroke();
    // axis arrows
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.moveTo(w - 12, cy - 4); ctx.lineTo(w, cy); ctx.lineTo(w - 12, cy + 4);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 4, 12); ctx.lineTo(cx, 0); ctx.lineTo(cx + 4, 12);
    ctx.fill();
    ctx.restore();
  }

  function toCanvas(pt, canvas, scale) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    return { x: cx + pt.x * scale, y: cy - pt.y * scale };
  }

  function fromCanvas(x, y, canvas, scale) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    return { x: (x - cx) / scale, y: -(y - cy) / scale };
  }

  function drawRay(ctx, canvas, angleRad, color, scale) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    const len = Math.max(rect.width, rect.height);
    const dx = Math.cos(angleRad) * len;
    const dy = Math.sin(angleRad) * len;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + dx, cy - dy);
    ctx.stroke();
    ctx.restore();
  }

  function drawPoint(ctx, canvas, pt, scale, color, radius = 6, stroke = '#0f172a') {
    const p = toCanvas(pt, canvas, scale);
    ctx.save();
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.arc(p.x, p.y, radius, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Branch computations ----------
  function computeValues(z, func, n, k, theta0Rad) {
    const r = Math.hypot(z.a, z.b);
    const arg = argWithCut(z.a, z.b, theta0Rad); // principal on chosen cut
    if (r === 0) {
      if (func === 'log') return { main: { x: -Infinity, y: NaN }, all: [] };
      return { main: { x: 0, y: 0 }, all: [] };
    }

    if (func === 'log') {
      // Log_{θ0,k}(z) = ln r + i (arg + 2πk)
      const y = arg + TAU * k;
      const main = { x: Math.log(r), y };
      const all = [];
      if (showAll.checked) {
        for (let j = k - 3; j <= k + 3; j++) {
          all.push({ x: Math.log(r), y: arg + TAU * j, k: j });
        }
      }
      return { main, all, r, arg };
    }

    const order = func === 'sqrt' ? 2 : n;
    const mainAng = (arg + TAU * k) / order;
    const mainMag = Math.pow(r, 1 / order);
    const main = { x: mainMag * Math.cos(mainAng), y: mainMag * Math.sin(mainAng) };
    const all = [];
    if (showAll.checked) {
      const maxK = order - 1;
      for (let j = 0; j < order; j++) {
        const ang = (arg + TAU * j) / order;
        const mag = mainMag;
        all.push({ x: mag * Math.cos(ang), y: mag * Math.sin(ang), k: j });
      }
    }
    return { main, all, r, arg };
  }

  // ---------- UI update ----------
  function syncKBounds() {
    if (func === 'log') {
      kHint.textContent = 'Log: k ∈ ℤ (small integers)';
      kVal.min = -9; kVal.max = 9;
    } else {
      const order = func === 'sqrt' ? 2 : n;
      kHint.textContent = `Branches: k = 0 … ${order - 1}`;
      kVal.min = 0; kVal.max = order - 1;
      if (+kVal.value > order - 1) kVal.value = order - 1;
      if (+kVal.value < 0) kVal.value = 0;
    }
  }

  function render() {
    func = funcSel.value;
    n = Math.max(2, Math.min(12, parseInt(nVal.value || '3', 10)));
    k = parseInt(kVal.value || '0', 10);
    theta0Deg = parseFloat(theta0.value || '0');
    z = { a: parseFloat(realIn.value || '0'), b: parseFloat(imagIn.value || '0') };
    if (snapUnit.checked) {
      const r = Math.hypot(z.a, z.b);
      if (r > 1e-9) {
        z.a /= r; z.b /= r;
      } else {
        z = { a: 1, b: 0 };
      }
      realIn.value = z.a.toFixed(3);
      imagIn.value = z.b.toFixed(3);
    }

    syncKBounds();

    // Resize canvases and fit scales
    resizeCanvas(dom, dctx);
    resizeCanvas(ran, rctx);

    // Domain scale to include z and some margin
    domScale = fitScale(dom, [ {x: z.a, y: z.b} ], domScale);
    // Compute values
    const theta0Rad = theta0Deg * Math.PI / 180;
    const { main, all, r, arg } = computeValues(z, func, n, k, theta0Rad);

    // Range scale to include outputs
    const ptsForRange = [main, ...all];
    ranScale = fitScale(ran, ptsForRange, ranScale);

    drawPlane(dctx, dom, domScale, theta0Rad, true, z, null);
    drawPlane(rctx, ran, ranScale, null, false, null, { main, all });

    updateDetails(z, func, n, k, theta0Rad, r, arg, main, all);
  }

  function drawPlane(ctx, canvas, scale, thetaCut, isDomain, zPoint, rangePts) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid(ctx, canvas, scale);
    if (isDomain && thetaCut !== null) {
      drawRay(ctx, canvas, thetaCut, '#22c55e', scale);
    }
    if (isDomain && zPoint) {
      drawPoint(ctx, canvas, {x: zPoint.a, y: zPoint.b}, scale, '#ef4444', 7, '#b91c1c');
    }
    if (!isDomain && rangePts) {
      // other branches
      if (showAll.checked) {
        rangePts.all.forEach(p => {
          drawPoint(ctx, canvas, {x: p.x, y: p.y}, scale, '#f59e0b', 5, '#b45309');
        });
      }
      // main
      drawPoint(ctx, canvas, {x: rangePts.main.x, y: rangePts.main.y}, scale, '#2563eb', 7, '#1d4ed8');
    }
  }

  function updateDetails(z, func, n, k, theta0Rad, r, arg, main, all) {
    const items = [];
    const argStr = formatAngle(arg);
    const cutStr = formatAngle(theta0Rad);
    items.push(`<li>z = ${z.a.toFixed(4)} + ${z.b.toFixed(4)} i &nbsp; |z| = ${r.toFixed(4)}, Arg_{θ₀}(z) = ${argStr} with θ₀ = ${cutStr}</li>`);
    if (func === 'log') {
      items.push(`<li><strong>Log</strong> branch: Log(z) = ln|z| + i (Arg_{θ₀}(z) + 2πk), &nbsp; k = ${k}</li>`);
      items.push(`<li>Value: ${main.x.toFixed(4)} + ${main.y.toFixed(4)} i</li>`);
      if (showAll.checked) {
        items.push('<li>Nearby k values:</li>');
        all.forEach(p => {
          items.push(`<li>&nbsp; k=${p.k}: ${p.x.toFixed(4)} + ${p.y.toFixed(4)} i</li>`);
        });
      }
    } else {
      const order = func === 'sqrt' ? 2 : n;
      items.push(`<li><strong>${func === 'sqrt' ? '√z' : 'z^{1/n}'}</strong> with n = ${order}, branch cut at θ₀, branch index k = ${k}</li>`);
      items.push(`<li>w_k = |z|^{1/n} · exp(i (Arg_{θ₀}(z) + 2πk)/n)</li>`);
      items.push(`<li>Value: ${main.x.toFixed(4)} + ${main.y.toFixed(4)} i</li>`);
      if (showAll.checked) {
        items.push(`<li>All ${order} branches (k = 0 … ${order-1}):</li>`);
        all.forEach(p => {
          items.push(`<li>&nbsp; k=${p.k}: ${p.x.toFixed(4)} + ${p.y.toFixed(4)} i</li>`);
        });
      }
    }
    details.innerHTML = items.join('');
  }

  // ---------- Events ----------
  funcSel.addEventListener('change', () => {
    func = funcSel.value;
    nWrap.style.display = func === 'nthroot' ? 'block' : 'none';
    render();
  });
  nVal.addEventListener('change', render);
  theta0.addEventListener('input', render);
  kVal.addEventListener('change', render);
  realIn.addEventListener('change', render);
  imagIn.addEventListener('change', render);
  showAll.addEventListener('change', render);
  snapUnit.addEventListener('change', render);

  btnUpdate.addEventListener('click', render);
  btnRandom.addEventListener('click', () => {
    const r = 0.4 + Math.random() * 2.6;
    const th = Math.random() * TAU;
    z = { a: r * Math.cos(th), b: r * Math.sin(th) };
    realIn.value = z.a.toFixed(2);
    imagIn.value = z.b.toFixed(2);
    render();
  });
  btnReset.addEventListener('click', () => {
    funcSel.value = 'log';
    nVal.value = 3;
    kVal.value = 0;
    theta0.value = 0;
    realIn.value = 1.0;
    imagIn.value = 0.0;
    showAll.checked = false;
    snapUnit.checked = false;
    render();
  });

  // Drag to move z
  dom.addEventListener('pointerdown', (e) => {
    dragging = true;
    dom.setPointerCapture(e.pointerId);
    movePoint(e);
  });
  dom.addEventListener('pointermove', (e) => {
    if (dragging) movePoint(e);
  });
  dom.addEventListener('pointerup', (e) => {
    dragging = false;
    dom.releasePointerCapture(e.pointerId);
  });
  dom.addEventListener('pointerleave', () => { dragging = false; });

  function movePoint(e) {
    const rect = dom.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const pt = fromCanvas(x, y, dom, domScale);
    if (snapUnit.checked) {
      const r = Math.hypot(pt.x, pt.y);
      if (r > 1e-9) { pt.x /= r; pt.y /= r; }
      else { pt.x = 1; pt.y = 0; }
    }
    realIn.value = pt.x.toFixed(3);
    imagIn.value = pt.y.toFixed(3);
    render();
  }

  window.addEventListener('resize', render);

  // Initial render
  render();
})();
</script>
</body>
</html>
